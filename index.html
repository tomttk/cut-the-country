<style>
  :root{
    --mat:#1f5c45; --mat-deep:#174a37; --mat-shadow:#0f3526;
    --print:#ece4ba; --print-dim:rgba(236,228,186,.62); --grid:rgba(236,228,186,.10); --grid-major:rgba(236,228,186,.24);
    --paper:#f7f4ec; --kraft:#cfa877; --ink:#1c211e; --ink-soft:#5b625c;
  }
  *{box-sizing:border-box}
  html{background:var(--mat-deep)}
  body{
    margin:0;min-height:100vh;color:var(--print);
    font-family:Archivo,"Helvetica Neue",Arial,"Noto Sans","Hiragino Sans","Yu Gothic UI","Malgun Gothic","Microsoft YaHei","PingFang SC",sans-serif;font-variation-settings:"wdth" 100;
    background-color:var(--mat-deep);
    background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
    background-size:38px 38px;background-position:-1px -1px;
    -webkit-font-smoothing:antialiased;
    display:flex;justify-content:center;padding:28px 18px 48px;
  }
  .wrap{width:100%;max-width:620px}
  button{font-family:inherit;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
  :focus-visible{outline:2px solid var(--print);outline-offset:3px;border-radius:4px}

  /* header */
  header{display:block}
  .title{position:relative;display:inline-block;margin:0;white-space:nowrap;font-size:clamp(28px,7.2vw,50px);line-height:.95;
    font-weight:850;font-variation-settings:"wdth" 118;letter-spacing:-.01em;color:var(--print)}
  .title .t{display:block}
  .title .t1{clip-path:polygon(0 0,100% 0,100% 30%,0 70%)}
  .title .t2{position:absolute;inset:0;clip-path:polygon(0 70%,100% 30%,100% 100%,0 100%);animation:slice .7s .45s cubic-bezier(.2,.9,.25,1.25) both}
  @keyframes slice{from{transform:none}to{transform:translate(3px,4px) rotate(.5deg)}}
  .lede{margin:12px 0 0;font-size:15px;color:var(--print-dim);max-width:34ch;line-height:1.4}
  .tools{display:flex;gap:8px;margin-left:auto;padding-bottom:8px;flex:none}
  .short{display:none}
  @media (max-width:400px){.short{display:inline}.long{display:none}}
  .round{width:40px;height:40px;border-radius:50%;border:1.5px solid var(--print-dim);background:transparent;color:var(--print);display:grid;place-items:center;cursor:pointer;transition:background .15s,border-color .15s}
  .round:hover{background:rgba(236,228,186,.1);border-color:var(--print)}
  .langwrap{position:relative}
  .lflag{display:block;border-radius:2px;box-shadow:0 0 0 1px rgba(0,0,0,.28)}
  #langBtn .lflag{width:20px;height:auto}
  .langmenu{position:absolute;right:0;top:calc(100% + 8px);z-index:30;width:212px;max-height:min(78vh,572px);overflow-y:auto;overscroll-behavior:contain;
    background:var(--paper);color:var(--ink);border-radius:4px;padding:6px;box-shadow:0 24px 50px -18px rgba(0,0,0,.85);animation:menu .2s cubic-bezier(.2,.9,.3,1)}
  .langmenu[hidden]{display:none}
  @keyframes menu{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
  .langmenu button{display:flex;align-items:center;gap:11px;width:100%;min-height:42px;border:0;background:none;padding:8px 10px;border-radius:3px;
    font-size:15px;font-weight:600;color:var(--ink);text-align:left;cursor:pointer}
  .langmenu button:hover,.langmenu button:focus-visible{background:#ebe4d3;outline:none}
  .langmenu button[aria-checked="true"]{font-weight:800}
  .langmenu button[aria-checked="true"]::after{content:"";margin-left:auto;width:8px;height:14px;border:solid var(--mat);border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-2px,-2px)}
  #soundBtn .off{display:none}
  #soundBtn[aria-pressed="true"] .on{display:none}
  #soundBtn[aria-pressed="true"] .off{display:block}
  #soundBtn[aria-pressed="true"]{color:var(--print-dim);border-style:dashed}

  /* mode switch */
  .modes{position:relative;display:flex;align-items:flex-end;flex-wrap:wrap;row-gap:6px;gap:26px;margin:24px 0 14px;border-bottom:1px solid var(--grid-major)}
  .mode{position:relative;border:0;background:none;color:var(--print-dim);font-size:16px;font-weight:650;padding:6px 0 12px;cursor:pointer;font-variation-settings:"wdth" 100}
  .mode[aria-selected="true"]{color:var(--print)}
  .mode:hover{color:var(--print)}
  .mode-bar{position:absolute;top:0;height:3px;background:var(--print);border-radius:2px;transition:left .35s cubic-bezier(.3,.9,.3,1),width .35s cubic-bezier(.3,.9,.3,1),top .35s}

  /* subject line */
  .subject{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:18px 0 12px}
  .country{display:flex;align-items:baseline;gap:12px;min-height:44px;font-size:clamp(30px,7vw,40px);font-weight:800;
    font-variation-settings:"wdth" 72;letter-spacing:-.005em;line-height:1.05}
  .country .flag{font-size:.7em;transform:translateY(-.06em)}
  .country .flag:empty{display:none}
  .cflag{display:block;width:1.3em;height:auto;border-radius:2px;box-shadow:0 0 0 1px rgba(0,0,0,.35),0 3px 8px -4px rgba(0,0,0,.6)}
  .country.swap{animation:swap .42s cubic-bezier(.2,.8,.2,1)}
  @keyframes swap{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .ref{font-size:14px;color:var(--print-dim);font-variant-numeric:tabular-nums;white-space:nowrap}

  /* cutting area */
  .stage{position:relative;aspect-ratio:1/1;width:100%;max-width:max(260px,calc(100vh - 32px));max-width:max(260px,calc(100svh - 32px));margin-inline:auto;border-radius:6px;overflow:hidden;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
    background-color:var(--mat);
    background-image:
      linear-gradient(var(--grid-major) 1px,transparent 1px),linear-gradient(90deg,var(--grid-major) 1px,transparent 1px),
      linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
    background-size:10% 10%,10% 10%,2.5% 2.5%,2.5% 2.5%;background-position:-1px -1px;
    box-shadow:0 0 0 1px rgba(0,0,0,.18),0 24px 40px -28px rgba(0,0,0,.7)}
  .guides{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
  .ruler{position:absolute;font-size:10px;font-weight:600;color:var(--print-dim);font-variant-numeric:tabular-nums;pointer-events:none;font-variation-settings:"wdth" 80}
  canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}
  canvas.locked{cursor:default}
  .overlay{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:24px;font-size:15px;color:var(--print);pointer-events:none}
  .overlay.hidden{display:none}
  .blade{width:44px;height:44px;margin:0 auto 12px;animation:spin 1.4s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  .cutbar{display:flex;justify-content:flex-end;gap:10px;margin-top:12px}
  .cutbar[hidden],.cutbar [hidden]{display:none!important}
  .btn.cut{background:var(--print);color:var(--ink);display:inline-flex;align-items:center;justify-content:center;gap:8px}
  @media (pointer:coarse){.cutbar .btn{flex:1;min-height:48px;font-size:16px}}
  @media (pointer:fine){#cutBtn{display:none!important}} /* computers cut on the second click */
  .hint{margin:14px 0 0;font-size:15px;line-height:1.45;color:var(--print-dim);max-width:60ch}
  .for-touch{display:none}
  @media (pointer:coarse){.for-touch{display:inline}.for-mouse{display:none}}
  .hint kbd{font:inherit;color:var(--print);border:1px solid var(--print-dim);border-radius:4px;padding:0 5px}

  /* result */
  .result{display:none;margin-top:18px}
  .result.show{display:block}
  .swatches{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .swatch{position:relative;border-radius:3px;padding:14px 16px 16px;color:var(--ink);box-shadow:0 2px 0 rgba(0,0,0,.18),0 10px 18px -12px rgba(0,0,0,.6)}
  .swatch.white{background:var(--paper)}
  .swatch.kraft{background:var(--kraft)}
  .swatch span{display:block;font-size:13px;color:var(--ink-soft);margin-bottom:4px}
  .swatch.kraft span{color:#5d4527}
  .swatch b{display:block;white-space:nowrap;font-size:clamp(32px,9vw,46px);line-height:1;font-weight:850;font-variation-settings:"wdth" 70;font-variant-numeric:tabular-nums}
  .result.show .swatch{animation:lay .5s cubic-bezier(.2,.9,.3,1.15) both}
  .result.show .swatch.white{animation-delay:.55s;--r:-1.2deg}
  .result.show .swatch.kraft{animation-delay:.65s;--r:1deg}
  @keyframes lay{from{opacity:0;transform:translateY(-14px) rotate(var(--r)) scale(1.03)}to{opacity:1;transform:none}}
  .verdict{display:flex;align-items:baseline;flex-wrap:wrap;gap:6px 14px;margin:18px 0 16px}
  .verdict strong{font-size:26px;font-weight:800;font-variation-settings:"wdth" 90;color:var(--print)}
  .verdict span{font-size:15px;color:var(--print-dim)}
  .result.show .verdict{animation:fade .4s .8s both}
  .result.show .actions,.result.show .countdown{animation:fade .4s .95s both}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .actions{display:flex;gap:10px;flex-wrap:wrap}
  .btn{border:0;border-radius:3px;background:var(--paper);color:var(--ink);font-size:15px;font-weight:700;padding:12px 18px;cursor:pointer;
    box-shadow:0 2px 0 rgba(0,0,0,.25);transition:transform .12s,box-shadow .12s}
  .btn:hover{transform:translateY(-1px);box-shadow:0 3px 0 rgba(0,0,0,.25)}
  .btn:active{transform:translateY(1px);box-shadow:0 1px 0 rgba(0,0,0,.25)}
  .btn.line{background:transparent;color:var(--print);box-shadow:inset 0 0 0 1.5px var(--print-dim)}
  .btn.line:hover{box-shadow:inset 0 0 0 1.5px var(--print)}
  .countdown{margin-top:16px;font-size:14px;color:var(--print-dim)}
  .countdown b{color:var(--print);font-variant-numeric:tabular-nums;font-weight:700}
  .copybox{width:100%;margin-top:12px;font:14px Archivo,sans-serif;border-radius:3px;border:0;background:var(--paper);color:var(--ink);padding:10px;display:none}

  footer{margin-top:34px;padding-top:14px;border-top:1px solid var(--grid-major);font-size:12.5px;line-height:1.5;color:var(--print-dim)}

  /* toast and sheets: paper slips on the mat */
  .toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,16px) rotate(-1deg);background:var(--paper);color:var(--ink);padding:11px 16px;border-radius:3px;
    font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;box-shadow:0 10px 24px -10px rgba(0,0,0,.6);max-width:90vw;text-align:center}
  .toast.show{opacity:1;transform:translate(-50%,0) rotate(-1deg)}
  .modal{position:fixed;inset:0;background:rgba(8,28,20,.55);display:none;align-items:center;justify-content:center;padding:18px;z-index:10}
  .modal.show{display:flex}
  .sheet{background:var(--paper);color:var(--ink);border-radius:3px;max-width:460px;width:100%;max-height:calc(100vh - 36px);max-height:calc(100dvh - 36px);overflow-y:auto;overscroll-behavior:contain;padding:24px 24px 22px;box-shadow:0 30px 60px -30px rgba(0,0,0,.8);
    animation:sheet .38s cubic-bezier(.2,.9,.3,1.1)}
  @keyframes sheet{from{opacity:0;transform:translateY(18px) rotate(-1.5deg)}to{opacity:1;transform:none}}
  .sheet h2{margin:0 0 16px;font-size:28px;font-weight:850;font-variation-settings:"wdth" 80;display:flex;justify-content:space-between;align-items:center}
  .x{width:34px;height:34px;border-radius:50%;border:1.5px solid #c9c3b2;background:none;color:var(--ink);cursor:pointer;font-size:15px}
  .rules p{margin:0 0 12px;font-size:15px;line-height:1.5}
  .scale{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px;margin-top:4px}
  .stats{display:grid;grid-template-columns:repeat(4,1fr);border-top:2px solid var(--ink);border-bottom:1px solid #d9d3c3;margin-bottom:18px}
  .stat{padding:12px 4px 10px}
  .stat+.stat{border-left:1px solid #d9d3c3;padding-left:10px}
  .stat b{display:block;font-size:30px;font-weight:850;font-variation-settings:"wdth" 70;line-height:1}
  .stat span{font-size:12px;color:var(--ink-soft)}
  .bars{display:flex;flex-direction:column;gap:7px}
  .bar{display:grid;grid-template-columns:104px 1fr 24px;align-items:center;gap:10px;font-size:14px}
  .bar i{display:block;height:12px;background:var(--mat);min-width:2px;border-radius:1px}
  .bar em{font-style:normal;text-align:right;color:var(--ink-soft);font-variant-numeric:tabular-nums}

  /* small phones: keep tabs and buttons on one row */
  @media (max-width:480px){.tools{gap:6px}.round{width:36px;height:36px}.modes{gap:18px}.mode{font-size:15px}}
  @media (max-width:400px){.tools{gap:4px}.round{width:34px;height:34px}.modes{gap:14px}.mode{font-size:14.5px}}
  /* very small phones: the four buttons get their own row above the tabs, whatever the language */
  @media (max-width:374px){.tools{order:-1;flex-basis:100%;justify-content:flex-end;margin:0 0 2px;padding:0;gap:8px}.modes{margin-top:18px}}
  /* ---------- "Pixel" theme: chunky pixels, muted palette, a dark workbench ---------- */
  html[data-theme="pixel"]{
    --mat:#2c4a4b; --mat-deep:#1e2326; --print:#ece4cf; --print-dim:rgba(236,228,207,.64); --grid:rgba(236,228,207,.06); --grid-major:rgba(236,228,207,.15);

  html[data-theme="pixel"] .mode{font-variation-settings:normal;font-weight:600}

  html[data-theme="pixel"] .stage{border-radius:0;box-shadow:0 0 0 4px #121516,8px 8px 0 4px rgba(6,8,9,.55);
    background-image:linear-gradient(var(--grid-major) 2px,transparent 2px),linear-gradient(90deg,var(--grid-major) 2px,transparent 2px);background-size:12.5% 12.5%}

  html[data-theme="pixel"] .btn:hover{transform:translate(-1px,-1px);box-shadow:5px 5px 0 #101314}
  html[data-theme="pixel"] .btn:active{transform:translate(2px,2px);box-shadow:2px 2px 0 #101314}
  html[data-theme="pixel"] .btn.line{border-color:var(--print-dim)}

<body>
<div class="wrap">
  <header>
    <div>
      <h1 class="title" id="title"><span class="t t1" aria-hidden="true"></span><span class="t t2" aria-hidden="true"></span></h1>

</div>

function withTimeout(p, ms){ return Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error("timeout")), ms))]); }
function loadScript(src){ return new Promise((res, rej) => { const s = document.createElement("script"); s.src = src; s.onload = res; s.onerror = () => rej(new Error("script " + src)); document.head.appendChild(s); }); }

function collect(features, getA2, getName){
  const out = new Map();
  for(const f of features || []){
    const g = f && f.geometry; if(!g) continue;
    let a2 = getA2(f); if(!a2 || a2 === "AQ" || a2 === "-99") continue;
    a2 = String(a2).toUpperCase();
    let polys = [];
    const add = geom => {
      if(!geom) return;
      if(geom.type === "Polygon") polys.push(geom.coordinates);
      else if(geom.type === "MultiPolygon") polys.push(...geom.coordinates);
      else if(geom.type === "GeometryCollection") (geom.geometries || []).forEach(add);
    };
    add(g);
    polys = polys.filter(p => p && p[0] && p[0].length >= 4);
    if(!polys.length) continue;
    if(out.has(a2)) out.get(a2).polys.push(...polys);
    else out.set(a2, {a2, name: getName(f), polys});
  }
  if(out.size < 100) throw new Error("trop peu de pays");
  return out;
}

function decodeEcharts(json){
  if(!json.UTF8Encoding) return;
  const scale = json.UTF8Scale == null ? 1024 : json.UTF8Scale;
  const dec = (str, off) => { const res = []; let px = off[0], py = off[1];
    for(let i = 0; i < str.length; i += 2){ let x = str.charCodeAt(i) - 64, y = str.charCodeAt(i + 1) - 64;
      x = (x >> 1) ^ (-(x & 1)); y = (y >> 1) ^ (-(y & 1)); x += px; y += py; px = x; py = y; res.push([x / scale, y / scale]); }
    return res; };
  for(const f of json.features){ const g = f.geometry; if(!g || !g.encodeOffsets) continue;
    if(g.type === "Polygon") g.coordinates = g.coordinates.map((r, i) => typeof r === "string" ? dec(r, g.encodeOffsets[i]) : r);
    else if(g.type === "MultiPolygon") g.coordinates = g.coordinates.map((p, i) => p.map((r, j) => typeof r === "string" ? dec(r, g.encodeOffsets[i][j]) : r));
  }
  json.UTF8Encoding = false;
}

/* ---------- geometry ---------- */
function laea(lon0, lat0){
  const l0 = lon0 * RAD, p0 = lat0 * RAD, s0 = Math.sin(p0), c0 = Math.cos(p0);
  return ([lon, lat]) => { const l = lon * RAD - l0, p = lat * RAD, cp = Math.cos(p), sp = Math.sin(p), cl = Math.cos(l);
    const d = 1 + s0 * sp + c0 * cp * cl; const k = d < 1e-9 ? 0 : Math.sqrt(2 / d);
    return [k * cp * Math.sin(l), k * (c0 * sp - s0 * cp * cl)]; };
}
function sphereMean(pts, weights){
  let x = 0, y = 0, z = 0;
  pts.forEach(([lon, lat], i) => { const w = weights ? weights[i] : 1, l = lon * RAD, p = lat * RAD;
    x += w * Math.cos(p) * Math.cos(l); y += w * Math.cos(p) * Math.sin(l); z += w * Math.sin(p); });
  return [Math.atan2(y, x) / RAD, Math.atan2(z, Math.hypot(x, y)) / RAD];
}
function ringArea(r){ let a = 0; for(let i = 0, n = r.length; i < n; i++){ const p = r[i], q = r[(i + 1) % n]; a += p[0] * q[1] - q[0] * p[1]; } return a / 2; }
function polyArea(poly){ return poly.reduce((s, r, i) => s + (i ? -1 : 1) * Math.abs(ringArea(r)), 0); }
function bboxOf(rings){ let a = [Infinity, Infinity, -Infinity, -Infinity]; for(const r of rings) for(const [x, y] of r){ if(x < a[0]) a[0] = x; if(y < a[1]) a[1] = y; if(x > a[2]) a[2] = x; if(y > a[3]) a[3] = y; } return a; }
function bboxDist(a, b){ return Math.hypot(Math.max(0, a[0] - b[2], b[0] - a[2]), Math.max(0, a[1] - b[3], b[1] - a[3])); }
function cleanRing(r){ const out = r.slice(); if(out.length > 1){ const f = out[0], l = out[out.length - 1]; if(f[0] === l[0] && f[1] === l[1]) out.pop(); } return out; }

const prepCache = new Map();
function prepare(entry){
  if(prepCache.has(entry.a2)) return prepCache.get(entry.a2);
  const polysLL = entry.polys.map(p => p.map(cleanRing)).filter(p => p[0].length >= 3);
  // pass 1: find the largest part
  let best = null, bestA = -1;
  for(const p of polysLL){ const c = sphereMean(p[0]); const pr = laea(c[0], c[1]); const a = polyArea(p.map(r => r.map(pr))); if(a > bestA){ bestA = a; best = c; } }
  // pass 2: drop small far-away parts
  let pr = laea(best[0], best[1]);
  let parts = polysLL.map(p => { const proj = p.map(r => r.map(pr)); return {ll: p, area: polyArea(proj), bb: bboxOf([proj[0]])}; });
  const total = parts.reduce((s, q) => s + q.area, 0);
  const largest = parts.reduce((m, q) => q.area > m.area ? q : m);
  const D = Math.hypot(largest.bb[2] - largest.bb[0], largest.bb[3] - largest.bb[1]);
  const anchors = parts.filter(q => q === largest || q.area >= 0.05 * total);
  const kept = parts.filter(q => anchors.includes(q) || anchors.some(a => bboxDist(a.bb, q.bb) <= 0.5 * D));
  // pass 3: recenter and fit into the virtual square (north up)
  const c = sphereMean(kept.map(q => sphereMean(q.ll[0])), kept.map(q => q.area));
  pr = laea(c[0], c[1]);
  let polys = kept.map(q => q.ll.map(r => r.map(pt => { const [x, y] = pr(pt); return [x, -y]; })));
  const bb = bboxOf(polys.map(p => p[0]));
  const s = (V * 0.84) / Math.max(bb[2] - bb[0], bb[3] - bb[1]);
  const ox = (V - (bb[2] - bb[0]) * s) / 2, oy = (V - (bb[3] - bb[1]) * s) / 2;
  polys = polys.map(p => p.map(r => r.map(([x, y]) => [(x - bb[0]) * s + ox, (y - bb[1]) * s + oy])));
  const res = {a2: entry.a2, name: entry.name, polys, area: polys.reduce((t, p) => t + polyArea(p), 0)};
  prepCache.set(entry.a2, res);
  return res;
}
// keep the side where sign * cross(B - A, P - A) >= 0
function clipRing(ring, A, B, sign){
  const ux = B[0] - A[0], uy = B[1] - A[1], out = [], n = ring.length;
  const side = p => sign * (ux * (p[1] - A[1]) - uy * (p[0] - A[0]));
  for(let i = 0; i < n; i++){
    const P = ring[i], Q = ring[(i + 1) % n], dp = side(P), dq = side(Q);
    if(dp >= 0) out.push(P);
    if((dp >= 0) !== (dq >= 0)){ const t = dp / (dp - dq); out.push([P[0] + t * (Q[0] - P[0]), P[1] + t * (Q[1] - P[1])]); }
  }
  return out;
}
function splitCountry(c, A, B){
  let pos = 0, neg = 0;
  for(const poly of c.polys) poly.forEach((r, i) => { const s = i ? -1 : 1;
    pos += s * Math.abs(ringArea(clipRing(r, A, B, 1))); neg += s * Math.abs(ringArea(clipRing(r, A, B, -1))); });
  const t = pos + neg; return {pos: pos / t * 100, neg: neg / t * 100};
}
function pieceCentroid(c, A, B, sign){
  let sx = 0, sy = 0, sw = 0;
  for(const poly of c.polys){ const r = clipRing(poly[0], A, B, sign); if(r.length < 3) continue;
    let a = 0, cx = 0, cy = 0;
    for(let i = 0, n = r.length; i < n; i++){ const p = r[i], q = r[(i + 1) % n], cr = p[0] * q[1] - q[0] * p[1]; a += cr; cx += (p[0] + q[0]) * cr; cy += (p[1] + q[1]) * cr; }
    if(Math.abs(a) < 1e-9) continue; a /= 2; cx /= 6 * a; cy /= 6 * a;
    const w = Math.abs(a); sx += cx * w; sy += cy * w; sw += w; }
  return sw ? [sx / sw, sy / sw] : null;
}

let LANG = "en";
const langInfo = code => LANGS.find(l => l[0] === code) || LANGS[0];
const locale = () => langInfo(LANG)[3];
// L("key", {n: 3}, count): picks the plural form for count when the entry has several
function L(key, vars = {}, count, fractionDigits = 0){
  let s = (I18N[LANG] && I18N[LANG][key]) ?? I18N.en[key] ?? key;
  if(typeof s === "object"){
    let cat = "other";
    try{ cat = new Intl.PluralRules(locale(), {minimumFractionDigits: fractionDigits}).select(count ?? 0); }catch(e){}
    s = s[cat] ?? s.other;
  }
  return s.replace(/\{(\w+)\}/g, (m, k) => vars[k] ?? m);
}

const hexRgb = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
const rgbHex = c => "#" + c.map(v => Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2, "0")).join("");

// slightly muted flag colours, the colour of the second piece, and the outfits
const PAL_CACHE = {};
function palette(a2){

function flagPixel(p, x, y){ // colour of pixel (x, y) of the 8×5 flag
  const c = p.cols, n = c.length, last = c[n - 1];
  switch(p.lay){
    case "v": return c[Math.floor(x * n / 8)];
    case "d": return x >= 3 && x <= 4 && y >= 1 && y <= 3 ? c[1] : c[0];
    case "x": return x === 3 || x === 4 || y === 2 ? (n > 2 && (x === 3 || y === 2) ? c[2] : c[1]) : c[0];
    case "n": return x === 2 || y === 2 ? last : c[0];
    case "t": { if(x <= Math.min(y, 4 - y)) return last; const s = n - 1; return c[Math.floor(y * s / 5)]; }
    case "k": { if(x <= 2 && y <= 1) return last; const s = Math.max(1, n - 1); return c[Math.floor(y * s / 5) % s]; }
    case "q": return c[(y < 2.5 ? 0 : 2) + (x < 4 ? 0 : 1)];
    case "o": return x >= 3 && x <= 4 && y >= 1 && y <= 3 ? c[1] : c[0];
    case "r": return (x >= 2 && x <= 5 && y === 2) || (x >= 3 && x <= 4 && (y === 1 || y === 3)) ? (x >= 3 && x <= 4 && y === 2 && c[2] ? c[2] : c[1]) : c[0];

}

}
function releaseGrab(e){
  if(!S.grabs.delete(e.pointerId)) return false;
  if(S.grabs.size === 0) SFX.tick(false);
  draw(); return true;
}
cv.addEventListener("pointerdown", e => {
  S.lastType = e.pointerType;
  const touch = e.pointerType !== "mouse";
  if((e.pointerType === "mouse" && e.button !== 0) || !S.country || S.cut) return;
  const pd = S.pending;
  if(pd && pd.adjust){ e.preventDefault(); grab(e); return; }
  if(S.press) return;
  e.preventDefault();
  const P = toVirtual(e);
  try{ cv.setPointerCapture(e.pointerId); }catch(err){}
  const second = !!pd;
  if(second) pd.B = P; else S.pending = {A: P, B: null, adjust: false};
  S.press = {x: e.clientX, y: e.clientY, id: e.pointerId, kind: second ? "second" : "first"};
  if(!touch) SFX.tick(second);
  draw();
});
cv.addEventListener("pointermove", e => {
  const pd = S.pending; if(!pd) return;
  if(moveGrab(e)) return;
  if(S.press){
    if(e.pointerId !== S.press.id) return;
    pd.B = toVirtual(e); draw(); return;
  }
  if(e.pointerType === "mouse" && !pd.adjust){ pd.B = toVirtual(e); draw(); }
});
cv.addEventListener("pointerup", e => {
  if(releaseGrab(e)) return;
  const pr = S.press; if(!pr || e.pointerId !== pr.id) return; S.press = null;
  const pd = S.pending; if(!pd) return;
  const P = toVirtual(e), touch = e.pointerType !== "mouse", dragged = Math.hypot(e.clientX - pr.x, e.clientY - pr.y) > 14;
  const confirmFirst = adjustFlow(e);
  if(pr.kind === "second" || dragged){
    pd.B = P;
    if(dist(pd.A, P) < 20){ pd.B = null; draw(); return; } // second point too close to the first: keep waiting
    if(confirmFirst){ SFX.tick(true); pd.adjust = true; draw(); return; } // phone: wait for the "Cut here" button
    if(touch || (dragged && pr.kind === "first")) SFX.tick(true);
    tryCommit(pd.A, P); return;
  }
  if(touch){ SFX.tick(false); pd.B = null; }
  draw();
});
cv.addEventListener("pointercancel", e => { S.grabs.delete(e.pointerId); if(S.press && S.press.id === e.pointerId) S.press = null; draw(); });
cv.addEventListener("contextmenu", e => {
  e.preventDefault();
  if(S.press || S.grabs.size || S.lastType !== "mouse") return; // a long press on a phone must not erase the line
  cancelCut();
});
$("eraseBtn").onclick = () => cancelCut();
$("cutBtn").onclick = () => { const pd = S.pending; if(pd && pd.B) tryCommit(pd.A, pd.B, true); };
// unlock audio on the first release or key press, as mobile browsers require
const unlockAudio = () => { if(!SFX.muted) SFX.ready(); };
document.addEventListener("pointerup", unlockAudio, {passive: true});
document.addEventListener("keydown", e => { if(e.key !== "Escape") unlockAudio(); });

function withCentroids(cut){
  cut.cA = pieceCentroid(S.country, cut.A, cut.B, 1); cut.cB = pieceCentroid(S.country, cut.A, cut.B, -1); return cut;
}
function commitCut(A, B, r){
  const gap = Math.abs(50 - r.pos);
  S.cut = withCentroids({A, B, pos: r.pos, neg: r.neg, gap});
  if(S.mode === "daily"){
    const rec = dailyRecords(); rec[todayIndex()] = {a2: S.country.a2, pos: r.pos, gap, line: [A, B]}; store.set("daily", rec);
  }
  SFX.cut(); SFX.verdict(tier(gap).k);
  if(PIXEL) setTimeout(() => crowdReact(tier(gap).k), 800);
  play([{key: "blade", delay: 0, dur: 280}, {key: "split", delay: 300, dur: 620}, {key: "label", delay: 700, dur: 360}]);
  showResult();
}

/* ---------- UI ---------- */
function setCountry(c, animate = true){
  S.country = c; S.cut = null; S.pending = null; S.press = null; S.grabs.clear();
  $("cname").textContent = regionName(c.a2, c.name); { const svg = countryFlagSvg(c.a2); if(svg) $("flag").innerHTML = svg; else $("flag").textContent = flagOf(c.a2); }
  const el = $("country"); el.classList.remove("swap"); void el.offsetWidth; el.classList.add("swap");
  S.fx = {drop: 1, blade: 1, split: 1, label: 1};
  if(animate) play([{key: "drop", delay: 0, dur: 520}]); else draw();
}
// fill the result panel in the current language; called again when the language changes
function fillResult(){
  const c = S.cut; if(!c) return;
  const a = Math.round(c.pos * 10) / 10, b = Math.round((100 - a) * 10) / 10, tr = tier(c.gap);
  $("pa").textContent = pct(a); $("pb").textContent = pct(b);
  $("verdict").textContent = tr.e + " " + L(tr.k);
  $("gap").textContent = c.gap < 0.05 ? L("exact") : L("gap", {n: fmt(c.gap)}, c.gap, 1);
  const act = $("actions"); act.innerHTML = "";
  if(S.mode === "daily"){
    act.append(button(L("copy"), "", shareDaily), button(L("practice"), "line", () => switchMode("practice")));
    $("countdown").style.display = "block"; tickCountdown();
  } else {
    act.append(button(L("recut"), "", () => { S.cut = null; hideResult(); setCountry(S.country); }),
               button(L("next"), "line", nextPractice));
    $("countdown").style.display = "none";
  }
}
function showResult(){
  $("copybox").style.display = "none";
  fillResult();
  // show the result before hiding the hint, so the page never shrinks and the phone does not jump to the top
  const res = $("result"); res.classList.remove("show"); void res.offsetWidth; res.classList.add("show");
  $("hint").style.display = "none";
  cv.classList.add("locked");
}
function hideResult(){ $("result").classList.remove("show"); $("hint").style.display = ""; cv.classList.remove("locked"); }
function button(label, cls, fn){ const b = document.createElement("button"); b.className = "btn " + cls; b.textContent = label; b.onclick = fn; return b; }

function shareDaily(){
  const c = S.cut, a = Math.round(c.pos * 10) / 10, b = Math.round((100 - a) * 10) / 10, tr = tier(c.gap);
  const text = L("shareTitle", {name: L("name"), n: todayIndex() + 1}) + "\n" + tr.e + " " + fmt(Math.min(a, b)) + " / " + fmt(Math.max(a, b)) + "\n" + L("shareGap", {n: fmt(c.gap)});
  const fallback = () => { const box = $("copybox"); box.value = text; box.style.display = "block"; box.focus(); box.select(); toast(L("copyBelow")); };
  try{ navigator.clipboard.writeText(text).then(() => toast(L("copied")), fallback); }catch(e){ fallback(); }
}
function tickCountdown(){
  const now = new Date(), next = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1);
  const s = Math.max(0, Math.floor((next - now) / 1000)), p = n => String(n).padStart(2, "0");
  $("countdown").innerHTML = L("countdown", {t: p(Math.floor(s / 3600)) + ":" + p(Math.floor(s / 60) % 60) + ":" + p(s % 60)});
}
setInterval(() => {
  if(S.mode === "daily" && S.cut) tickCountdown();
  if(S.mode === "daily" && S.world && S.country && S.country.dayIdx !== todayIndex() && !S.pending) loadDaily();
}, 1000);

function loadDaily(){
  const idx = todayIndex(), rec = dailyRecords()[idx];
  const c = prepare(S.world.get(rec && S.world.has(rec.a2) ? rec.a2 : dailyA2(idx)));
  c.dayIdx = idx;
  setBadge();
  hideResult(); setCountry(c, !rec);
  if(rec){ S.cut = withCentroids({A: rec.line[0], B: rec.line[1], pos: rec.pos, neg: 100 - rec.pos, gap: rec.gap}); draw(); showResult(); }
}
function nextPractice(){
  const keys = POOL.filter(a => S.world.has(a) && a !== S.practiceA2);
  S.practiceA2 = keys[Math.floor(Math.random() * keys.length)];
  setBadge();
  hideResult(); setCountry(prepare(S.world.get(S.practiceA2)));
}
function moveBar(){
  const tab = S.mode === "daily" ? $("tabDaily") : $("tabPractice"), bar = $("modeBar");
  bar.style.left = tab.offsetLeft + "px"; bar.style.width = tab.offsetWidth + "px"; bar.style.top = (tab.offsetTop + tab.offsetHeight - 1) + "px";
}
function switchMode(m){
  S.mode = m; $("tabDaily").setAttribute("aria-selected", m === "daily"); $("tabPractice").setAttribute("aria-selected", m === "practice");
  moveBar();
  if(!S.world) return;
  if(m === "daily") loadDaily(); else nextPractice();
}
$("tabDaily").onclick = () => switchMode("daily");
$("tabPractice").onclick = () => switchMode("practice");

function openModal(id){ $(id).classList.add("show"); const x = $(id).querySelector("[data-close]"); if(x) x.focus(); }
document.querySelectorAll(".modal").forEach(m => m.addEventListener("click", e => { if(e.target === m || e.target.closest("[data-close]")) m.classList.remove("show"); }));
document.addEventListener("keydown", e => {
  if((e.key === "m" || e.key === "M") && !e.ctrlKey && !e.metaKey && !e.altKey && !/input|textarea/i.test(e.target.tagName)){ $("soundBtn").click(); return; }
  if(e.key !== "Escape") return;
  if(!$("langMenu").hidden){ toggleLangMenu(false); $("langBtn").focus(); return; }
  const open = document.querySelectorAll(".modal.show");
  if(open.length) open.forEach(m => m.classList.remove("show")); else cancelCut(); });
$("helpBtn").onclick = () => openModal("helpModal");
$("statsBtn").onclick = () => { renderStats(); openModal("statsModal"); };
function renderStats(){
  const rec = dailyRecords(), days = Object.keys(rec).map(Number).sort((a, b) => a - b), gaps = days.map(d => rec[d].gap);
  let streak = 0; for(let d = todayIndex() - (rec[todayIndex()] ? 0 : 1); rec[d]; d--) streak++;
  let bestRun = 0, run = 0, prev = null; for(const d of days){ run = prev !== null && d === prev + 1 ? run + 1 : 1; bestRun = Math.max(bestRun, run); prev = d; }
  const avg = gaps.length ? gaps.reduce((a, b) => a + b, 0) / gaps.length : null, best = gaps.length ? Math.min(...gaps) : null;
  $("statsGrid").innerHTML = [[days.length, L("played")], [avg == null ? "–" : fmt(avg), L("avg")], [best == null ? "–" : fmt(best), L("best")], [streak, bestRun > streak ? L("streakRec", {n: bestRun}) : L("streak")]]
    .map(([v, l]) => "<div class='stat'><b>" + v + "</b><span>" + l + "</span></div>").join("");
  const tiers = [["🎯", "perfect", g => g <= .25], ["🟩", "excellent", g => g > .25 && g <= 1], ["🟨", "good", g => g > 1 && g <= 2.5], ["🟧", "ok", g => g > 2.5 && g <= 5], ["🟥", "missed", g => g > 5]];
  const counts = tiers.map(([, , f]) => gaps.filter(f).length), max = Math.max(1, ...counts);
  $("bars").innerHTML = tiers.map(([e, k], i) => "<div class='bar'><span>" + e + " " + L(k) + "</span><i style='width:" + (counts[i] / max * 100) + "%'></i><em>" + counts[i] + "</em></div>").join("");
}

/* ---------- language ---------- */
function setBadge(){ $("badge").textContent = S.mode === "daily" ? L("badgeDaily", {n: todayIndex() + 1}) : L("badgeRandom"); }
function setFooter(){ $("footer").textContent = L("footer") + (S.source ? " " + L("credit", {src: S.source.credit}) : ""); }
function applyLanguage(code, user = false){
  LANG = I18N[code] ? code : "en";
  if(user) store.set("lang", LANG);
  const info = langInfo(LANG);
  document.documentElement.lang = info[3];
  document.title = L("name");
  const title = $("title"); title.setAttribute("aria-label", L("name"));
  title.querySelectorAll(".t").forEach(s => s.textContent = L("name"));
  document.querySelectorAll("[data-i18n]").forEach(el => el.textContent = L(el.dataset.i18n));
  document.querySelectorAll("[data-i18n-html]").forEach(el => el.innerHTML = L(el.dataset.i18nHtml));
  document.querySelectorAll("[data-i18n-aria]").forEach(el => el.setAttribute("aria-label", L(el.dataset.i18nAria)));
  document.querySelectorAll("[data-i18n-title]").forEach(el => el.title = L(el.dataset.i18nTitle));
  if(S.loadFailed){ const o = $("overlayText"); if(o) o.innerHTML = L("loadError"); }
  // grading scale, with numbers written the local way
  const steps = [["🎯", "scaleFirst", .25, 2], ["🟩", "scaleLess", 1, 0], ["🟨", "scaleLess", 2.5, 1], ["🟧", "scaleLess", 5, 0]];
  $("scale").innerHTML = steps.map(([e, k, n, d]) => "<span>" + e + "</span><span>" + L(k, {n: fmt(n, d)}, n, d) + "</span>").join("") + "<span>🟥</span><span>" + L("scaleMore") + "</span>";
  $("langFlag").innerHTML = flagSvg(info[1], 20);
  labelSound();
  if(S.country) $("cname").textContent = regionName(S.country.a2, S.country.name);
  if(S.world) setBadge();
  setFooter();
  if(S.cut && $("result").classList.contains("show")) fillResult();
  if($("statsModal").classList.contains("show")) renderStats();
  buildLangMenu();
  draw(); moveBar();
}
function buildLangMenu(){
  $("langMenu").innerHTML = LANGS.map(([code, flag, name, loc]) =>
    `<button role="menuitemradio" aria-checked="${code === LANG}" data-lang="${code}" lang="${loc}">${flagSvg(flag)}<span>${name}</span></button>`).join("");
}
function toggleLangMenu(open){
  const menu = $("langMenu"), btn = $("langBtn"), show = open ?? menu.hidden;
  menu.hidden = !show; btn.setAttribute("aria-expanded", show);
  if(show){ const cur = menu.querySelector('[aria-checked="true"]'); if(cur){ cur.scrollIntoView({block: "nearest"}); cur.focus(); } }
}
$("langBtn").onclick = e => { e.stopPropagation(); toggleLangMenu(); };
$("langMenu").onclick = e => {
  const b = e.target.closest("[data-lang]"); if(!b) return;
  applyLanguage(b.dataset.lang, true); toggleLangMenu(false); $("langBtn").focus();
};
$("langMenu").addEventListener("keydown", e => {
  const items = [...$("langMenu").querySelectorAll("button")], i = items.indexOf(document.activeElement);
  if(e.key === "ArrowDown" || e.key === "ArrowUp"){ e.preventDefault(); items[(i + (e.key === "ArrowDown" ? 1 : -1) + items.length) % items.length].focus(); }
});
document.addEventListener("click", e => { if(!$("langMenu").hidden && !e.target.closest(".langwrap")) toggleLangMenu(false); });

/* ---------- boot ---------- */
if(PIXEL) startIdle();
applyLanguage(store.get("lang", "en"));
buildRulers();
new ResizeObserver(() => { resize(); moveBar(); }).observe($("stage"));
if(document.fonts && document.fonts.ready) document.fonts.ready.then(moveBar);
if(!store.get("seenHelp", false)){ store.set("seenHelp", true); setTimeout(() => openModal("helpModal"), 900); }
loadWorld().then(({data, source}) => {
  S.world = data; S.source = source;
  $("overlay").classList.add("hidden");
  setFooter();
  switchMode(S.mode);
}).catch(() => {
  S.loadFailed = true; $("overlay").innerHTML = "<div id='overlayText'>" + L("loadError") + "</div>";
});

</script>
</body>
</html>
